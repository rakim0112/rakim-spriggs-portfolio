# Dedicated static site for ScoutBoard Central.
# Set Base directory to "scoutboard" in Netlify, publish directory to ".".
# No npm install or build command is required.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
